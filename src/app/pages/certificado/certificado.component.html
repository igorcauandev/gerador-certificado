<div class="d-flex flex-column align-items-center">
  <div class="d-flex justify-content-between align-items-center menu-certificado w-100">
      <div routerLink="/" class="d-flex align-items-center btn-voltar">
          <i class="ph ph-arrow-left"></i>
          <p class="m-0">Voltar</p>
      </div>
    <app-secundary-button phclass="ph ph-download-simple" textButton="Download" (click)="downloadCertificadoAsPNG()"></app-secundary-button>
  </div>
  @if (certificado) {
    <div #certificadoContainer class="certificado d-flex justify-content-center align-items-center">
    <img class="icon-medal" src="assets/images/certificate_ribbon.png" alt="icone medalha">
    <div class="conteudo-certificado">
      <img class="img-assinatura" src="assets/images/certificate_signature.svg" alt="Assinatura">
      <div class="info-certificado d-flex align-items-center flex-column">
        <div class="titulo-subtitulo-certificado">
          <h1>CERTIFICADO DE CONCLUSÃO</h1>
          <P>Este certificado comprova que</P>
        </div>
        
        <p class="nome-aluno">{{ certificado.nome }}</p>

        <div class="lista-atividade-group">
          <p class="lista-atividade-titulo">Concluiu com sucesso as seguintes atividades</p>
          <p class="lista-atividade">{{ certificado.atividades.join(', ') }}</p>
        </div>
      </div>
      <p class="data-emissao">Emitido em {{ certificado.dataEmissao }}</p>
    </div>
    
  </div>
  }
</div>
